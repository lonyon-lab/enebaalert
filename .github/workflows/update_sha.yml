name: Obtener SHA de Eneba

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  get-sha:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 🔑 CLAVE: permite hacer push
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar playwright
        run: |
          pip install playwright
          playwright install chromium
      
      - name: Ejecutar script para obtener SHA
        run: python get_sha.py
      
      - name: Subir sha.txt como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sha_actualizado
          path: sha.txt
      
      - name: Commit y push automático
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sha.txt
          git diff --staged --quiet || git commit -m "Actualizar SHA de Eneba"
          git push
