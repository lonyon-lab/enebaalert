name: Actualizar tipos de cambio

on:
  repository_dispatch:
    types: [update-tipos-cambio]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Ejecutar script de tipos de cambio
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python tipos_cambio.py
